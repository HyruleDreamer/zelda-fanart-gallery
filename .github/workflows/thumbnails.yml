name: Generate illustration thumbnails

on:
  push:
    branches: [main, review/stories-beyond-hyrule]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  thumbnails:
    # Never push previews from arbitrary branches, forks, or pull-request events.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/review/stories-beyond-hyrule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the latest version of this same branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install thumbnail tools
        run: python -m pip install -r scripts/requirements.txt
      - name: Test original preservation and thumbnail sizing
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate previews
        run: python scripts/generate_thumbnails.py
      - name: Save thumbnails on this branch only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'HyruleDreamer'
          git config user.email '340979993+HyruleDreamer@users.noreply.github.com'
          git add -- thumbnails/
          if git diff --cached --quiet; then
            echo 'All thumbnails are already up to date.'
            exit 0
          fi
          git commit -m 'Generate illustration thumbnails'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
